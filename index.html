<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .date-section {
            margin-bottom: 30px;
        }
        
        .date-header {
            font-size: 18px;
            font-weight: bold;
            color: #444;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #ddd;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .gallery-item {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .gallery-item:hover {
            transform: scale(1.03);
        }
        
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        
        .file-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .gallery-item:hover .file-name {
            opacity: 1;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            overflow: auto;
        }
        
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Galeri Foto</h1>
    <div id="galleryContainer"></div>
    
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="expandedImage">
    </div>

    <script>
        // Konfigurasi
        const REPO_OWNER = "rif-01";  // Ganti dengan username GitHub Anda
        const REPO_NAME = "faturah";  // Ganti dengan nama repo
        const IMAGE_FOLDER = "uploads";  // Folder tempat menyimpan gambar
        
        // 1. Fungsi utama untuk memuat galeri
        async function loadGallery() {
            try {
                const galleryData = await fetchImages();
                renderGallery(galleryData);
            } catch (error) {
                console.error("Gagal memuat galeri:", error);
                document.getElementById('galleryContainer').innerHTML = 
                    "<p>Gagal memuat galeri. Silakan coba lagi nanti.</p>";
            }
        }
        
        // 2. Fetch daftar gambar dari GitHub
        async function fetchImages() {
            const response = await fetch(
                `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${IMAGE_FOLDER}`
            );
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            const files = await response.json();
            const galleryData = {};
            
            files.forEach(file => {
                if (file.type === "file" && file.name.match(/\.(jpg|jpeg|png)$/i)) {
                    // Ekstrak tanggal dari nama file (format: YYYYMMDD_namafile.jpg)
                    const dateMatch = file.name.match(/^(\d{4})(\d{2})(\d{2})_/);
                    
                    if (dateMatch) {
                        const [, year, month, day] = dateMatch;
                        const dateKey = `${year}-${month}-${day}`;
                        
                        if (!galleryData[dateKey]) {
                            galleryData[dateKey] = [];
                        }
                        
                        galleryData[dateKey].push({
                            src: file.download_url,
                            name: file.name.replace(/^\d{8}_/, "") // Hapus tanggal dari nama file
                        });
                    }
                }
            });
            
            return galleryData;
        }
        
        // 3. Render galeri ke HTML
        function renderGallery(galleryData) {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';
            
            // Urutkan tanggal dari terbaru ke terlama
            const sortedDates = Object.keys(galleryData).sort((a, b) => 
                new Date(b) - new Date(a));
            
            sortedDates.forEach(date => {
                const dateSection = document.createElement('div');
                dateSection.className = 'date-section';
                
                const dateHeader = document.createElement('div');
                dateHeader.className = 'date-header';
                dateHeader.textContent = `Diunggah pada: ${formatDate(date)}`;
                
                const gallery = document.createElement('div');
                gallery.className = 'gallery';
                
                galleryData[date].forEach(item => {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.innerHTML = `
                        <img src="${item.src}" alt="${item.name}" loading="lazy">
                        <div class="file-name">${item.name}</div>
                    `;
                    gallery.appendChild(galleryItem);
                    
                    // Tambahkan event listener untuk preview gambar
                    setupImageModal(galleryItem.querySelector('img'));
                });
                
                dateSection.appendChild(dateHeader);
                dateSection.appendChild(gallery);
                container.appendChild(dateSection);
            });
        }
        
        // 4. Format tanggal ke bahasa Indonesia
        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { 
                weekday: 'long', 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric' 
            };
            return date.toLocaleDateString('id-ID', options);
        }
        
        // 5. Fungsi untuk preview gambar
        function setupImageModal(imgElement) {
            imgElement.addEventListener('click', function() {
                const modal = document.getElementById('imageModal');
                const modalImg = document.getElementById('expandedImage');
                modal.style.display = "block";
                modalImg.src = this.src;
            });
        }
        
        // 6. Tutup modal
        document.querySelector('.close').addEventListener('click', function() {
            document.getElementById('imageModal').style.display = "none";
        });
        
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('imageModal')) {
                document.getElementById('imageModal').style.display = "none";
            }
        });
        
        // Auto-refresh setiap 5 menit (opsional)
        setInterval(loadGallery, 300000);
        
        // Muat galeri saat halaman pertama kali dibuka
        loadGallery();
    </script>
</body>
</html>
