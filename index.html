<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faturah Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
            position: relative;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .date-section {
            margin-bottom: 30px;
        }
        
        .date-header {
            font-size: 18px;
            font-weight: bold;
            color: #444;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #ddd;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .gallery-item {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            cursor: pointer;
            position: relative;
        }
        
        .gallery-item:hover {
            transform: scale(1.03);
        }
        
        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        
        .file-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .gallery-item:hover .file-name {
            opacity: 1;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            overflow: auto;
        }
        
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .add-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: #4CAF50;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 100;
        }
        
        .add-btn:hover {
            background-color: #45a049;
        }
        
        #fileInput {
            display: none;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <h1>Faturah Gallery</h1>
    
    <div id="galleryContainer">
        <!-- Gallery content will be dynamically inserted here -->
    </div>
    
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="expandedImage">
    </div>
    
    <div class="add-btn" onclick="document.getElementById('fileInput').click()">+</div>
    <input type="file" id="fileInput" accept=".jpg,.jpeg" multiple>
    
    <div id="loading" class="loading" style="display: none;">
        Mengupload gambar...
    </div>

    <script>
        // Configuration
        const GITHUB_USERNAME = "rif-01";
        const GITHUB_REPO = "faturah";
        const galleryData = {};
        
        // Initialize modal functionality
        function setupImageModal(imgElement) {
            imgElement.addEventListener('click', function() {
                const modal = document.getElementById('imageModal');
                const modalImg = document.getElementById('expandedImage');
                modal.style.display = "block";
                modalImg.src = this.src;
            });
        }
        
        // Render gallery based on galleryData
        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';
            
            // Sort dates from newest to oldest
            const sortedDates = Object.keys(galleryData).sort((a, b) => new Date(b) - new Date(a));
            
            sortedDates.forEach(date => {
                const dateSection = document.createElement('div');
                dateSection.className = 'date-section';
                
                const dateHeader = document.createElement('div');
                dateHeader.className = 'date-header';
                dateHeader.textContent = `Diunggah pada: ${formatDate(date)}`;
                
                const gallery = document.createElement('div');
                gallery.className = 'gallery';
                
                galleryData[date].forEach(item => {
                    const galleryItem = document.createElement('div');
                    galleryItem.className = 'gallery-item';
                    galleryItem.innerHTML = `
                        <img src="${item.src}" alt="${item.name}">
                        <div class="file-name">${item.name}</div>
                    `;
                    gallery.appendChild(galleryItem);
                    
                    setupImageModal(galleryItem.querySelector('img'));
                });
                
                dateSection.appendChild(dateHeader);
                dateSection.appendChild(gallery);
                container.appendChild(dateSection);
            });
        }
        
        // Format date to Indonesian locale
        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            return date.toLocaleDateString('id-ID', options);
        }
        
        // Upload file to GitHub
        async function uploadToGitHub(file) {
            const fileName = `uploads/${Date.now()}_${file.name}`;
            
            const content = await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            const token = prompt("Masukkan GitHub Token:");
            if (!token) throw new Error("Token diperlukan untuk upload");

            const response = await fetch(
                `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${fileName}`,
                {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload ${file.name}`,
                        content: content,
                        branch: 'main'
                    })
                }
            );
            
            if (!response.ok) {
                const error = await response.text();
                throw new Error(error || "Upload gagal");
            }
            
            const data = await response.json();
            return data.content.download_url;
        }
        
        // Load existing images from GitHub
        async function loadExistingImages() {
            try {
                // In a real implementation, you would fetch images from GitHub API here
                console.log("Loading existing images...");
            } catch (error) {
                console.error("Gagal memuat gambar:", error);
            }
        }
        
        // Event listeners
        document.querySelector('.close').addEventListener('click', function() {
            document.getElementById('imageModal').style.display = "none";
        });
        
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('imageModal')) {
                document.getElementById('imageModal').style.display = "none";
            }
        });
        
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;
            
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';
            
            try {
                for (const file of files) {
                    try {
                        // Validate file type
                        if (!['image/jpeg', 'image/jpg'].includes(file.type)) {
                            alert(`File ${file.name} bukan JPG/JPEG!`);
                            continue;
                        }
                        
                        // Upload to GitHub
                        const downloadURL = await uploadToGitHub(file);
                        
                        // Add to gallery
                        const today = new Date().toISOString().split('T')[0];
                        if (!galleryData[today]) galleryData[today] = [];
                        
                        galleryData[today].push({
                            src: downloadURL,
                            name: file.name
                        });
                        
                    } catch (error) {
                        console.error(`Gagal upload ${file.name}:`, error);
                        alert(`Gagal upload ${file.name}: ${error.message}`);
                    }
                }
                
                renderGallery();
                
            } finally {
                loading.style.display = 'none';
                e.target.value = '';
            }
        });
        
        // Initialize
        loadExistingImages();
        renderGallery();
    </script>
</body>
</html>
