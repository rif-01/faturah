name: Auto Upload & Cleanup
on:
  push:
    paths:
      - 'uploads/**'  # Trigger saat ada perubahan di folder uploads

jobs:
  upload_and_cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Auto-commit Uploads
        run: |
          if [ -n "$(git status --porcelain uploads/)" ]; then
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add uploads/
            git commit -m "Auto-upload: $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No new files to upload"
          fi

      - name: Delete Old Files
        run: |
          python -c "
          import os, datetime
          cutoff = datetime.datetime.now() - datetime.timedelta(days=30)
          for filename in os.listdir('uploads'):
              if filename.endswith(('.jpg', '.jpeg')):
                  filepath = os.path.join('uploads', filename)
                  ctime = datetime.datetime.fromtimestamp(os.path.getctime(filepath))
                  if ctime < cutoff:
                      os.remove(filepath)
                      print(f'Deleted: {filename}')
          "